<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ BRAND_NAME }}{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background-color:#ffffff;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="background-color:#0b1f3a;padding:20px 28px;color:#ffffff;font-size:20px;font-weight:bold;letter-spacing:0.5px;">
              {{ BRAND_NAME }}
            </td>
          </tr>
          <tr>
            <td style="padding:32px 28px;font-size:15px;line-height:1.6;color:#374151;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="background-color:#f9fafb;padding:20px 28px;font-size:12px;line-height:1.5;color:#6b7280;border-top:1px solid #e5e7eb;">
              <p style="margin:0 0 8px;">Cryptocurrency and forex trading involve significant risk, including loss of capital. Profits are not guaranteed.</p>
              <p style="margin:0 0 8px;">{{ BRAND_NAME }} will never ask for your password or OTP.</p>
              <p style="margin:0;"><a href="{{ FRONTEND_URL }}" style="color:#1a56db;text-decoration:none;">{{ FRONTEND_URL }}</a></p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
